name: verify-pin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned source
        id: pin
        run: |
          python3 -c "import json; lock=json.load(open('pstack.lock.json')); print('commit=' + lock['commit']); print('repository=' + lock['repository'])" >> "$GITHUB_OUTPUT"

      - name: Clone the pinned upstream
        env:
          PIN_COMMIT: ${{ steps.pin.outputs.commit }}
          PIN_REPOSITORY: ${{ steps.pin.outputs.repository }}
        run: |
          git clone --filter=blob:none --no-checkout "$PIN_REPOSITORY" .pin-clone
          git -C .pin-clone checkout "$PIN_COMMIT"

      - name: Verify the vendored skills match the pin
        run: python3 scripts/verify-pin.py --clone .pin-clone
