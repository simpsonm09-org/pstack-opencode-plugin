name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@c732c65876683ff08f02a191a932a36eed434d78 # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@c732c65876683ff08f02a191a932a36eed434d78 # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@c732c65876683ff08f02a191a932a36eed434d78 # repo-standard main

  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@c732c65876683ff08f02a191a932a36eed434d78 # repo-standard main
