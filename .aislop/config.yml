# aislop configuration. Docs: https://scanaislop.com/docs/configuration
ci:
  failBelow: 80

# http-cache-semantics 4.2.0 carries CVE-2026-93748 with no fixed version, and
# it reaches this package transitively through @opencode/plugin. The standard's
# Trivy vulnerability scan is the dependency gate for this repository, so the
# duplicate aislop audit is off here.
security:
  audit: false

# skills/ is generated by scripts/build.ps1 from the pinned upstream and is
# byte-identical to it. The port-authored sources are the adapter skills under
# adapter/ (markdown, not scanned); scanning the generated mirror raises findings
# on code this port cannot edit. Exclude the generated tree so the gate covers
# only code the port owns. Specifying exclude replaces the built-in defaults, so
# the defaults are restated here.
exclude:
  - node_modules
  - .git
  - dist
  - build
  - coverage
  - "skills/**"
